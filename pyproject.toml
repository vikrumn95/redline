[project]
name = "redline"
version = "0.1.0"
description = "BTC/ETH spot momentum bot (MVP)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
